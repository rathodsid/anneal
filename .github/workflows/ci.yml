name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    name: frozen bar + target-agnostic guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frozen-bar integrity (schemas + golden fixture are SHA-pinned in verify.sh)
        run: |
          fail=0
          while read -r want path; do
            got="$(shasum -a 256 "$path" | awk '{print $1}')"
            if [ "$got" != "$want" ]; then
              echo "::error::FROZEN FILE CHANGED: $path (expected $want, got $got)"; fail=1
            fi
          done < <(grep -oE '_pin [0-9a-f]{64} [^ ]+' verify.sh | awk '{print $2, $3}')
          exit $fail

      - name: Corpus integrity (P1-P5 present, N1 still expects RED)
        run: |
          for f in P1 P2 P3 P4 P5 N1; do
            ls parity/corpus/"$f"-*.nl.txt >/dev/null 2>&1 \
              || { echo "::error::corpus flow $f is missing"; exit 1; }
          done
          grep -q 'expect: RED' parity/corpus/N1-negative-oracle-honesty.nl.txt \
            || { echo "::error::N1 oracle-honesty marker defeated"; exit 1; }

      - name: Target-agnostic guard (no app literals in engine code)
        run: |
          deny='campaign-v2|campaign-test-agent|input-max-concurrency|input-campaign|input-start-date|input-end-date|btn-(add|create|campaign)|select-outbound-agent|btn-back-to-campaigns|/campaign-v2'
          if grep -rniE "$deny" packages/*/src; then
            echo "::error::target-specific literal in engine code"; exit 1
          fi

      - name: D31 — cold executor has no LLM in its dependency graph
        run: |
          if grep -rEn 'import[[:space:]]+anneal_llm|from[[:space:]]+anneal_llm' packages/anneal-executor/src; then
            echo "::error::anneal-executor imports anneal_llm (violates D31)"; exit 1
          fi

  audit:
    name: m0 audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q -m m0_audit

  cold-lane:
    name: m0 golden + m1 cold lane + API contract (no LLM keys)
    runs-on: ubuntu-latest
    env:
      ANNEAL_DB_URL: postgresql+psycopg://anneal:anneal@localhost:55432/anneal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: docker compose up -d --wait postgres golden-app
      - run: uv run alembic upgrade head
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -m "m0_golden or m1 or api_contract"

  console:
    name: console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

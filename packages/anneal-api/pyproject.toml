[project]
name = "anneal-api"
version = "0.1.0"
description = "The ONE API (D32) — FastAPI. CLI + console are thin clients; rulings are web-only."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "anneal-executor",
    "anneal-db",
    "anneal-artifacts",
    "anneal-scheduler",
    "anneal-authoring",
    "anneal-classify",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_api"]

[tool.uv.sources]
anneal-core = { workspace = true }
anneal-executor = { workspace = true }
anneal-db = { workspace = true }
anneal-artifacts = { workspace = true }
anneal-scheduler = { workspace = true }
anneal-authoring = { workspace = true }
anneal-classify = { workspace = true }

[project]
name = "anneal-classify"
version = "0.1.0"
description = "§7 routing + §9 incident state machine + budgets/oscillation (D27) + re-freeze/re-author."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "anneal-db",
    "anneal-executor",
    "anneal-artifacts",
    "anneal-authoring",
    "anneal-heal",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_classify"]

[tool.uv.sources]
anneal-core = { workspace = true }
anneal-db = { workspace = true }
anneal-executor = { workspace = true }
anneal-artifacts = { workspace = true }
anneal-authoring = { workspace = true }
anneal-heal = { workspace = true }

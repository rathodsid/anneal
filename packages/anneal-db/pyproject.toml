[project]
name = "anneal-db"
version = "0.1.0"
description = "SQLAlchemy 2.0 models + Alembic migrations + repositories (§3)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_db"]

[tool.uv.sources]
anneal-core = { workspace = true }

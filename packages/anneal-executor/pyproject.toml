[project]
name = "anneal-executor"
version = "0.1.0"
description = "The step-interpreter + browser layer. MUST NOT depend on anneal-llm (D31)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_executor"]

[tool.uv.sources]
anneal-core = { workspace = true }

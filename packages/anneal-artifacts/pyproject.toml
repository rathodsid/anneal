[project]
name = "anneal-artifacts"
version = "0.1.0"
description = "ArtifactStore impls: LocalDiskStore (D34)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_artifacts"]

[tool.uv.sources]
anneal-core = { workspace = true }

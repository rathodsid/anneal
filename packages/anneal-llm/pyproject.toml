[project]
name = "anneal-llm"
version = "0.1.0"
description = "The A15+B6 LLM seam: balanced-brace extractor, provider fallback, param quirks."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_llm"]

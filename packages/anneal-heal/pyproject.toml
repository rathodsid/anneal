[project]
name = "anneal-heal"
version = "0.1.0"
description = "WARM lane (D28): ladder-first locator heal, LLM-over-DOM fallback, drain all drifts (A13)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "anneal-executor",
    "anneal-llm",
    "anneal-authoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_heal"]

[tool.uv.sources]
anneal-core = { workspace = true }
anneal-executor = { workspace = true }
anneal-llm = { workspace = true }
anneal-authoring = { workspace = true }

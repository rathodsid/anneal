[project]
name = "anneal-authoring"
version = "0.1.0"
description = "HOT lane: recon→TerritoryNotes, ambiguity interview, NL author, calibration (D24-D27)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anneal-core",
    "anneal-executor",
    "anneal-llm",
    "anneal-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_authoring"]

[tool.uv.sources]
anneal-core = { workspace = true }
anneal-executor = { workspace = true }
anneal-llm = { workspace = true }
anneal-db = { workspace = true }

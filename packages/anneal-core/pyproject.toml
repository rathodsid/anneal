[project]
name = "anneal-core"
version = "0.1.0"
description = "Domain model + compiler. No playwright, no db, no llm, no http."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal_core"]
